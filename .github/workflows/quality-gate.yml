name: AI Quality Gate

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: python -m pip install -r backend_fastapi/requirements.txt
      - name: Run operations tests
        run: python -m unittest backend_fastapi.tests.test_ops
      - name: Run retrieval quality gate
        env:
          MIN_RECALL_AT_K: "0.50"
          MIN_MRR_AT_K: "0.50"
          MIN_NDCG_AT_K: "0.60"
        run: python backend_fastapi/evaluate_retrieval.py --cases backend_fastapi/evaluation/retrieval_cases.json
      - name: Run embedding drift gate
        run: python backend_fastapi/evaluate_embedding_drift.py --reference backend_fastapi/evaluation/embedding_reference.json --current backend_fastapi/evaluation/embedding_current.json
